[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "mcp-mailcow"
version = "1.0.0"
description = "Model Context Protocol server for Mailcow — read/send mail and manage your Mailcow server from Claude"
readme = "../README.md"
license = { text = "MIT" }
authors = [
    { name = "Maxime Olivier", email = "git@maximeolivier.fr" },
]
keywords = ["mcp", "mailcow", "mail", "imap", "smtp", "claude", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27",
    "imapclient>=3.0",
    "pyyaml>=6.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.21",
]

[project.urls]
Homepage = "https://github.com/maximeoliv/mcp-mailcow"
Documentation = "https://github.com/maximeoliv/mcp-mailcow#readme"
Repository = "https://github.com/maximeoliv/mcp-mailcow"
Issues = "https://github.com/maximeoliv/mcp-mailcow/issues"

[project.scripts]
mcp-mailcow = "mcp_mailcow.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_mailcow"]

[tool.hatch.build.targets.wheel.shared-data]
"../tools-schema.yaml" = "mcp_mailcow/tools-schema.yaml"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PL"]
ignore = ["PLR0913"]  # too many arguments — fine for tool params

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
