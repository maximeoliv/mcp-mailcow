name: Release Python (PyPI)

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC for trusted PyPI publishing
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip build

      - name: Copy schema into package data
        # The pyproject.toml maps ../tools-schema.yaml → mcp_mailcow/tools-schema.yaml
        # at build time via hatchling's shared-data, but a quick check first.
        run: ls -la ../tools-schema.yaml

      - name: Build wheel + sdist
        run: python -m build

      - name: Run tests against built wheel
        run: |
          pip install dist/*.whl
          pip install pytest pytest-asyncio respx httpx pyyaml platformdirs imapclient
          pytest tests/ -v

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-alpha') && !contains(github.ref, '-beta')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: py/dist

      - name: Publish to TestPyPI (alpha/beta)
        if: contains(github.ref, '-alpha') || contains(github.ref, '-beta')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: py/dist
