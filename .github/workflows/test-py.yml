name: Python tests

on:
  push:
    paths:
      - "py/**"
      - "tools-schema.yaml"
      - ".github/workflows/test-py.yml"
  pull_request:
    paths:
      - "py/**"
      - "tools-schema.yaml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run pytest
        run: pytest -v

      - name: Lint with ruff
        run: ruff check src

      - name: Type check with mypy
        run: mypy src/mcp_mailcow
        continue-on-error: true  # mypy strict, allow soft fail until codebase fully typed
